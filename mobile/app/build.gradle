plugins { id 'com.android.application' }
android {
 namespace 'world.africandroid.credit'
 compileSdk 35
 defaultConfig {
  applicationId 'world.africandroid.credit'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
  buildConfigField 'String', 'APP_URL', '"' + (project.findProperty('appUrl') ?: 'https://jobs.africandroid.world') + '"'
 }
 buildFeatures { buildConfig true }
}
