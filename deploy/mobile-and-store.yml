---
- name: Install Africa Credit Android and publish existing store listing
  hosts: localhost
  connection: local
  become: true
  vars:
    credit_mobile_source: /opt/africa-credit-mobile-release
    credit_store_source: /opt/africa-credit-store-release
    credit_store_database: /var/lib/africanappsstore/store.sqlite3
    credit_apk_sha256: b7bee65e839ec6adb75aaef652c948296187bd5aab00ddca6d768cf9191efd7f
  tasks:
    - name: Pull Africa Credit without discarding local changes
      ansible.builtin.git:
        repo: https://github.com/olamidebello/Africa-Credit.git
        dest: "{{ credit_mobile_source }}"
        version: main
        force: false
    - name: Pull current store source without discarding local changes
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: "{{ credit_store_source }}"
        version: main
        force: false
    - name: Verify bundled signed APK checksum
      ansible.builtin.stat:
        path: "{{ credit_mobile_source }}/static/downloads/africa-credit.apk"
        checksum_algorithm: sha256
      register: apk
    - name: Require expected APK
      ansible.builtin.assert:
        that: apk.stat.checksum | default('') == credit_apk_sha256
    - name: Discover existing store working directory
      ansible.builtin.command: systemctl show africanappsstore.service --property=WorkingDirectory --value
      register: store_code
      changed_when: false
    - name: Require existing service and directory
      ansible.builtin.assert:
        that:
          - store_code.stdout is match('^/')
          - store_code.stdout | trim != '/'
    - name: Back up and update existing store with its health and rollback checks
      ansible.builtin.command:
        argv: [python3, "{{ credit_store_source }}/tools/update_store.py"]
      changed_when: true
    - name: Create store asset directory
      ansible.builtin.file:
        path: "{{ store_code.stdout | trim }}/static/africacredit"
        state: directory
        mode: '0755'
    - name: Install APK and checksum
      ansible.builtin.copy:
        src: "{{ credit_mobile_source }}/static/downloads/{{ item }}"
        dest: "{{ store_code.stdout | trim }}/static/africacredit/{{ item }}"
        remote_src: true
        mode: '0644'
      loop: [africa-credit.apk, africa-credit.apk.sha256]
    - name: Install listing in existing store database
      ansible.builtin.command:
        argv: [python3, "{{ credit_store_source }}/tools/install_africacredit.py", --database, "{{ credit_store_database }}", --assets, "{{ store_code.stdout | trim }}/static/africacredit"]
      changed_when: true
    - name: Check public APK download
      ansible.builtin.uri:
        url: https://africanappsstore.space/downloads/africa-credit.apk
        method: HEAD
        status_code: 200
        validate_certs: true
    - name: Check public store listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: catalog
      failed_when: catalog.status != 200 or 'credit.africandroid.world' not in catalog.content
    - name: Discover existing Africa Credit working directory
      ansible.builtin.command: systemctl show africa-credit.service --property=WorkingDirectory --value
      register: credit_code
      changed_when: false
    - name: Require installed Africa Credit service
      ansible.builtin.assert:
        that:
          - credit_code.stdout is match('^/')
          - credit_code.stdout | trim != '/'
    - name: Install website download assets
      ansible.builtin.file:
        path: "{{ credit_code.stdout | trim }}/static/downloads"
        state: directory
        mode: '0755'
    - name: Publish direct website download
      ansible.builtin.copy:
        src: "{{ credit_mobile_source }}/static/downloads/{{ item }}"
        dest: "{{ credit_code.stdout | trim }}/static/downloads/{{ item }}"
        remote_src: true
        mode: '0644'
      loop: [africa-credit.apk, africa-credit.apk.sha256]
    - name: Publish Africa Credit install page
      ansible.builtin.copy:
        src: "{{ credit_mobile_source }}/static/download.html"
        dest: "{{ credit_code.stdout | trim }}/static/download.html"
        remote_src: true
        mode: '0644'
    - name: Verify live website install page
      ansible.builtin.uri:
        url: https://credit.africandroid.world/download.html
        return_content: true
        validate_certs: true
      register: install_page
      failed_when: install_page.status != 200 or '/downloads/africa-credit.apk' not in install_page.content
